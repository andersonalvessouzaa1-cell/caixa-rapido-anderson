<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa Rápido — Anderson</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--card:#161616;--sec:#a476ff;--tx:#dfdfdf;--mu:#f3f3f398;--ln:#f3f3f31a;--ok:#7fd6a0;--bad:#ff7a7a;--warn:#f0c36a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#101010}}
html,body{height:auto;margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,-apple-system,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}::selection{background:var(--sec);color:var(--bg)}
.w{max-width:1040px;margin:0 auto;padding:84px 20px 110px}
nav{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:14px;display:flex;gap:6px;background:#101010cc;backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:16px;padding:6px}
nav button{background:none;border:0;color:var(--mu);font:500 13px Montserrat,sans-serif;padding:9px 13px;border-radius:11px;cursor:pointer}
nav button.on,nav button:hover{color:#fff;background:#f3f3f312}
h1{font-size:clamp(32px,6vw,58px);font-weight:500;line-height:1.05;margin:6px 0 14px}h2{font-size:18px;font-weight:600;margin:0 0 12px}
.mu{color:var(--mu)}.s{color:var(--sec)}.c{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:16px}
.g{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.k b{display:block;font-size:24px;font-weight:600;margin-top:4px}.in{color:var(--ok)}.out{color:var(--bad)}
.pv{border-style:dashed}
input,select,button.b{font:500 14px Montserrat,sans-serif}input,select{background:#0c0c0c;color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--sec)}
button.b{background:var(--sec);color:#101010;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600}button.b.o{background:none;color:var(--tx);border:1px solid var(--ln)}button.b.sm{padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input:first-child{flex:1;min-width:180px}
.ch{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:20px;padding:5px 11px;font:12px Montserrat;cursor:pointer}
.tr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}.tr small{color:var(--mu);display:block}.tr.del{opacity:.5;text-decoration:line-through}
.bar{height:7px;background:#f3f3f312;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--sec)}
.warn{border-color:var(--warn)}.tg{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;border:1px solid var(--ln);border-radius:12px;padding:10px 16px;z-index:20;display:flex;gap:12px;align-items:center;font-size:13px}
.ov{position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:center;padding:20px}.ov .c{width:min(440px,100%);margin:0}
textarea{width:100%;height:140px;background:#0c0c0c;color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:12px 'JetBrains Mono',monospace}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu)}
.sig{font:13px 'JetBrains Mono',ui-monospace,monospace;color:#00ff41;text-shadow:0 0 6px #00ff4180}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;border-top:1px solid var(--ln);text-align:left}td:last-child,th:last-child{text-align:right}
summary{cursor:pointer;padding:8px 0}
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;align-items:center}
@media(max-width:760px){nav{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);justify-content:space-between}nav button{padding:9px 6px;font-size:11px;flex:1}.g3,.g2,.hero{grid-template-columns:1fr}.w{padding-top:30px}}
</style></head><body><div id="app"></div>
<script>
// ===== DOMÍNIO (regras financeiras puras, sem DOM) =====
const BRL=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>new Date().toLocaleDateString('sv',{timeZone:'America/Sao_Paulo'});
const addDias=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const CATS={Mercado:/mercado|supermerc|feira|padaria|comida|restaurante|almo[çc]o|lanche/i,Transporte:/uber|[ôo]nibus|gasolina|combust|metr[ôo]|transporte|estaciona/i,Moradia:/aluguel|condom[ií]nio|moradia/i,Lazer:/cinema|streaming|jogo|lazer|bar|show|viagem/i,'Saúde':/farm[áa]cia|rem[ée]dio|m[ée]dico|sa[úu]de|consulta/i,Contas:/internet|luz|energia|[áa]gua|telefone|conta|celular/i,Renda:/sal[áa]rio|renda|freela|receb|ganhei|dep[óo]sito/i,Outros:/^$/};
function interpreta(s){const m=s.match(/\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/);if(!m)return{erro:'Não encontrei um valor. Ex.: "gastei 45 mercado hoje".'};
 const valor=parseFloat(m[0].replace(/\.(?=\d{3})/g,'').replace(',','.'));if(!(valor>0))return{erro:'O valor precisa ser maior que zero.'};
 const tipo=/receb|ganhei|sal[áa]rio|entrada|dep[óo]sito|renda/i.test(s)?'in':'out';
 let cat=null;for(const k in CATS){if(k!=='Outros'&&CATS[k].test(s)){cat=k;break}}
 if(tipo==='in'&&cat!=='Renda')cat='Renda';
 const data=/ontem/i.test(s)?addDias(hoje(),-1):hoje();
 let d=s.replace(m[0],'').replace(/r\$|reais|hoje|ontem|gastei|paguei|comprei|recebi|ganhei/ig,'').replace(/\s+(de|no|na|com|em)\s+/ig,' ').replace(/\s+/g,' ').trim();
 d=(d||cat||'Lançamento');return{desc:d[0].toUpperCase()+d.slice(1),valor,tipo,cat,data};}
const mes=d=>d.slice(0,7);
const vivos=S=>S.tx.filter(t=>!t.del);
function resumo(S,m){const v=vivos(S).filter(t=>mes(t.data)===m);const e=v.filter(t=>t.tipo==='in').reduce((a,t)=>a+t.valor,0),s=v.filter(t=>t.tipo==='out').reduce((a,t)=>a+t.valor,0);
 const p=S.rec.filter(r=>!r.ok);const pe=p.filter(r=>r.tipo==='in').reduce((a,r)=>a+r.valor,0),ps=p.filter(r=>r.tipo==='out').reduce((a,r)=>a+r.valor,0);
 return{e,s,saldo:e-s,pe,ps,prev:e-s+pe-ps}}
const gastoCat=(S,m)=>{const o={};vivos(S).filter(t=>t.tipo==='out'&&mes(t.data)===m).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.valor);return o};
function csv(S){const q=x=>'"'+String(x).replace(/"/g,'""')+'"';return['data;descricao;categoria;tipo;valor'].concat(vivos(S).sort((a,b)=>a.data<b.data?-1:1).map(t=>[t.data,q(t.desc),t.cat,t.tipo==='in'?'entrada':'saida',t.valor.toFixed(2).replace('.',',')].join(';'))).join('\n')}
// ===== ESTADO (dados fictícios) =====
const seed=()=>({tx:[[1,'in','Entrada de exemplo',3500,'Renda','05'],[2,'out','Aluguel de exemplo',1200,'Moradia','05'],[3,'out','Mercado',286.4,'Mercado','07'],[4,'out','Transporte',64.9,'Transporte','08'],[5,'out','Cinema',89,'Lazer','09'],[6,'out','Internet',99.9,'Contas','10'],[7,'out','Feira',142.35,'Mercado','10'],[8,'out','Farmácia',58,'Saúde','11']].map(a=>({id:a[0],tipo:a[1],desc:a[2],valor:a[3],cat:a[4],data:'2026-11-'+a[5]})),
 orc:{Mercado:700,Transporte:250,Moradia:1300,Lazer:300,Contas:400,'Saúde':200},
 rec:[{id:1,desc:'Streaming',valor:39.9,dia:18,cat:'Lazer',tipo:'out'},{id:2,desc:'Internet',valor:99.9,dia:20,cat:'Contas',tipo:'out'},{id:3,desc:'Entrada extra de exemplo',valor:500,dia:25,cat:'Renda',tipo:'in'}]});
let S=seed(),V='land',pend=null,ed=null,tg=null,pilha=[],nid=100,flt={q:'',t:'',c:'',d:false},csvTxt=null,M='2026-11';
const snap=()=>JSON.stringify(S);
function act(fn,msg){pilha.push(snap());fn();tg=msg?{msg}:null;render();if(msg)setTimeout(()=>{tg=null;render()},5000)}
function desfazer(){if(!pilha.length)return;S=JSON.parse(pilha.pop());tg={msg:'Ação desfeita'};render();setTimeout(()=>{tg=null;render()},2500)}
// ===== UI =====
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=d=>d.slice(8)+'/'+d.slice(5,7);const catSel=(v,id)=>`<select id="${id}">${Object.keys(CATS).map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}</select>`;
function barras(){const dias=30,v=Array(dias).fill(0);vivos(S).filter(t=>t.tipo==='out'&&mes(t.data)===M).forEach(t=>v[+t.data.slice(8)-1]+=t.valor);const mx=Math.max(100,...v),W=600,H=170;
 return`<svg viewBox="0 0 ${W} ${H+30}" width="100%" role="img" aria-label="Saídas por dia em novembro de 2026, em reais"><text x="0" y="12" fill="#999" font-size="11">Saídas por dia — nov/2026 (R$) · máx ${BRL(mx)}</text>${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*(H-25)}" y2="${H-f*(H-25)}" stroke="#ffffff14"/>`).join('')}${v.map((x,i)=>`<rect x="${i*20+3}" y="${H-x/mx*(H-25)}" width="14" height="${x/mx*(H-25)}" rx="3" fill="#a476ff"><title>Dia ${i+1}: ${BRL(x)}</title></rect>${i%5==0?`<text x="${i*20+3}" y="${H+16}" fill="#999" font-size="11">${i+1}</text>`:''}`).join('')}</svg>`}
function linha(){const h=hoje(),dias=30,s=[];let ac=0;for(let d=1;d<=dias;d++){const k=M+'-'+String(d).padStart(2,'0');vivos(S).filter(t=>t.data===k).forEach(t=>ac+=t.tipo==='in'?t.valor:-t.valor);s.push(k<=h?ac:null)}
 let p=ac;const pr=[];for(let d=1;d<=dias;d++){const k=M+'-'+String(d).padStart(2,'0');S.rec.filter(r=>!r.ok&&r.dia===d).forEach(r=>p+=r.tipo==='in'?r.valor:-r.valor);pr.push(k>=h?p:null)}
 const all=s.concat(pr).filter(x=>x!==null),mn=Math.min(0,...all),mx=Math.max(1,...all),W=600,H=160,X=i=>i*(W/29),Y=v=>H-(v-mn)/(mx-mn)*(H-20);
 const pth=a=>a.map((v,i)=>v===null?'':(a[i-1]==null||i==0?'M':'L')+X(i)+','+Y(v)).join(' ');
 return`<svg viewBox="0 0 ${W} ${H+30}" width="100%" role="img" aria-label="Saldo acumulado do mês em reais"><text x="0" y="12" fill="#999" font-size="11">Saldo acumulado — nov/2026 (R$) · realizado (linha) e previsto (tracejado)</text><path d="${pth(s)}" fill="none" stroke="#7fd6a0" stroke-width="2.5"/><path d="${pth(pr)}" fill="none" stroke="#a476ff" stroke-width="2.5" stroke-dasharray="6 5"/>${[1,10,20,30].map(d=>`<text x="${X(d-1)}" y="${H+18}" fill="#999" font-size="11">${d}</text>`).join('')}<text x="${W-110}" y="${Y(mx)+12}" fill="#999" font-size="11">máx ${BRL(mx)}</text></svg>`}
const row=(t,ac)=>`<div class="tr ${t.del?'del':''}"><div>${esc(t.desc)}<small>${dt(t.data)} · ${t.cat}</small></div><div class="row"><b class="${t.tipo}">${t.tipo==='in'?'+':'−'}${BRL(t.valor)}</b>${ac?(t.del?`<button class="b o sm" onclick="rest(${t.id})">Restaurar</button>`:`<button class="b o sm" onclick="abrirEd(${t.id})">Editar</button><button class="b o sm" onclick="rem(${t.id})">Remover</button>`):''}</div></div>`;
function orcs(lim){const g=gastoCat(S,M);return Object.keys(S.orc).slice(0,lim||99).map(c=>{const p=(g[c]||0)/S.orc[c]*100;return`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span>${c}</span><span class="mu">${BRL(g[c]||0)} de ${BRL(S.orc[c])}</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--bad)':p>80?'var(--warn)':'var(--sec)'}"></i></div></div>`}).join('')}
function kpis(){const r=resumo(S,M);return`<div class="g g3"><div class="c k"><span class="mu">Saldo realizado · nov/2026</span><b>${BRL(r.saldo)}</b></div><div class="c k"><span class="mu">Entradas realizadas</span><b class="in">${BRL(r.e)}</b></div><div class="c k"><span class="mu">Saídas realizadas</span><b class="out">${BRL(r.s)}</b></div></div><div class="c pv"><h2>Previsto — ainda não aconteceu</h2><div class="row" style="gap:26px"><span>A receber <b class="in">${BRL(r.pe)}</b></span><span>A pagar <b class="out">${BRL(r.ps)}</b></span><span>Saldo previsto no fim do mês <b>${BRL(r.prev)}</b></span></div></div>`}
const foot=()=>`<footer><span>Demonstração — dados fictícios · BRL · America/Sao_Paulo</span><span class="sig">Rudeboybrdev</span></footer>`;
const VIEWS={
land:()=>`<div class="hero"><div><span class="s">Caixa Rápido</span><h1>Anote em uma linha. Entenda o mês inteiro.</h1><p class="mu">Digite “gastei 45 mercado hoje”, confira a interpretação e acompanhe saldo, orçamento e contas previstas, sem planilha manual.</p><div class="row"><button class="b" onclick="go('painel')">Entrar com Google (demonstração)</button><button class="b o" onclick="go('painel')">Ver o painel</button></div></div><div class="c" style="margin:0">${kpis().split('<div class="c pv">')[0]}${barras()}</div></div>
<div class="g g3" style="margin-top:26px"><div class="c"><h2>Captura por texto</h2><span class="mu">Você vê o que foi entendido e corrige antes de salvar.</span></div><div class="c"><h2>Realizado ≠ previsto</h2><span class="mu">Contas futuras ficam separadas do saldo real até você confirmar.</span></div><div class="c"><h2>Seus dados, em CSV</h2><span class="mu">Exporte o histórico a qualquer momento.</span></div></div>
<div class="c"><h2>Como usar</h2><span class="mu">1. Escreva o lançamento · 2. Confira a interpretação · 3. Confirme. Recorrências viram previsões até você confirmar o pagamento.</span></div>`,
painel:()=>`<span class="mu">Seu dinheiro, com clareza.</span><h1>Olá, Anderson</h1><div class="c"><h2>Captura rápida</h2><div class="row"><input id="q" placeholder="Ex.: gastei 45 mercado hoje · recebi 800 freela" value="${esc(pend?pend.src:'')}" onkeydown="if(event.key==='Enter')cap()"><button class="b" onclick="cap()">Registrar</button></div><div class="row" style="margin-top:10px">${['gastei 45 mercado hoje','paguei 120 luz ontem','recebi 800 freela','uber 23,50','comprei 30 coisas'].map(x=>`<button class="ch" onclick="$('q').value='${x}';cap()">${x}</button>`).join('')}</div>${pend?interp():''}<details style="margin-top:12px"><summary class="s">Formulário alternativo</summary><div class="row"><input id="fd" placeholder="Descrição"><input id="fv" type="number" step="0.01" placeholder="Valor" style="width:110px"><select id="ft"><option value="out">Saída</option><option value="in">Entrada</option></select>${catSel('Outros','fc')}<input id="fa" type="date" value="${hoje()}" style="flex:0"><button class="b" onclick="form()">Adicionar</button></div></details></div>${kpis()}<div class="c">${barras()}</div><div class="g g2"><div class="c"><h2>Orçamentos do mês</h2>${orcs(4)}<button class="b o sm" onclick="go('categorias')">Ver todos</button></div><div class="c"><h2>Transações recentes</h2>${vivos(S).sort((a,b)=>b.data<a.data?-1:b.data>a.data?1:b.id-a.id).slice(0,5).map(t=>row(t)).join('')}<button class="b o sm" onclick="go('historico')">Ver histórico</button></div></div>`,
historico:()=>`<h1>Histórico</h1><div class="c"><div class="row"><input id="hq" placeholder="Buscar descrição..." value="${esc(flt.q)}" oninput="flt.q=this.value;hl()"><select onchange="flt.t=this.value;hl()"><option value="">Todos os tipos</option><option value="in" ${flt.t=='in'?'selected':''}>Entradas</option><option value="out" ${flt.t=='out'?'selected':''}>Saídas</option></select><select onchange="flt.c=this.value;hl()"><option value="">Todas as categorias</option>${Object.keys(CATS).map(c=>`<option ${flt.c==c?'selected':''}>${c}</option>`).join('')}</select><label class="mu"><input type="checkbox" ${flt.d?'checked':''} onchange="flt.d=this.checked;hl()"> mostrar removidos</label></div><div id="hl"></div></div>`,
categorias:()=>`<h1>Categorias e orçamentos</h1><div class="c"><h2>Orçamento mensal por categoria</h2>${orcs()}</div><div class="c"><h2>Definir orçamento</h2><div class="row">${catSel('Mercado','oc')}<input id="ov" type="number" min="0" placeholder="Valor mensal (R$)"><button class="b" onclick="setOrc()">Salvar</button></div></div>`,
recorrencias:()=>`<h1>Recorrências e planejamento</h1><div class="c pv"><h2>Previstas (não realizadas)</h2>${S.rec.filter(r=>!r.ok).map(r=>`<div class="tr"><div>${esc(r.desc)}<small>dia ${r.dia} · ${r.cat}</small></div><div class="row"><b class="${r.tipo}">${BRL(r.valor)}</b><button class="b sm" onclick="conf(${r.id})">Confirmar ${r.tipo==='in'?'recebimento':'pagamento'}</button></div></div>`).join('')||'<span class="mu">Nada previsto.</span>'}</div><div class="c"><h2>Nova recorrência</h2><div class="row"><input id="rd" placeholder="Descrição"><input id="rv" type="number" step="0.01" placeholder="Valor" style="width:110px"><input id="rdia" type="number" min="1" max="30" placeholder="Dia" style="width:80px"><select id="rt"><option value="out">Saída</option><option value="in">Entrada</option></select>${catSel('Contas','rc')}<button class="b" onclick="addRec()">Cadastrar</button></div></div><div class="c"><h2>Já confirmadas</h2>${S.rec.filter(r=>r.ok).map(r=>`<div class="tr"><span>${esc(r.desc)}</span><span class="mu">${BRL(r.valor)}</span></div>`).join('')||'<span class="mu">Nenhuma ainda.</span>'}</div>`,
relatorios:()=>{const g=gastoCat(S,M),tot=Object.values(g).reduce((a,b)=>a+b,0)||1;return`<h1>Relatórios e exportação</h1><div class="c">${linha()}</div><div class="c"><h2>Saídas por categoria — nov/2026</h2><table><tr><th>Categoria</th><th>% das saídas</th><th>Valor (R$)</th></tr>${Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${c}</td><td>${(v/tot*100).toFixed(0)}%</td><td>${BRL(v)}</td></tr>`).join('')}</table></div><div class="c"><h2>Exportar CSV</h2><span class="mu">Separador “;”, valores em reais.</span><div class="row" style="margin:10px 0"><button class="b" onclick="csvTxt=csv(S);render()">Gerar CSV</button>${csvTxt?'<button class="b o" onclick="copiar()">Copiar</button>':''}</div>${csvTxt?`<textarea readonly id="ct">${esc(csvTxt)}</textarea><div class="mu" style="font-size:12px;margin-top:6px">Nesta página publicada o download direto é bloqueado; copie o texto e salve como .csv.</div>`:''}</div>`},
ajustes:()=>`<h1>Ajustes e ajuda</h1><div class="c"><h2>Preferências</h2><div class="tr"><span>Moeda</span><span class="mu">BRL (R$)</span></div><div class="tr"><span>Fuso horário</span><span class="mu">America/Sao_Paulo</span></div><div class="tr"><span>Conta</span><span class="mu">Google (demonstração, sem login real)</span></div><div class="row" style="margin-top:12px"><button class="b o" onclick="act(()=>{S=seed();pend=null},'Dados de demonstração restaurados')">Restaurar dados fictícios</button><button class="b o" onclick="go('land')">Ver landing</button></div></div><div class="c"><h2>Ajuda</h2><details><summary>Como escrevo um lançamento?</summary><span class="mu">Valor + descrição, ex.: “gastei 45 mercado hoje”. Palavras como “recebi” ou “salário” viram entrada.</span></details><details><summary>O que é “previsto”?</summary><span class="mu">Recorrências ainda não confirmadas. Só entram no saldo realizado após confirmar.</span></details><details><summary>Posso desfazer?</summary><span class="mu">Sim: botão “Desfazer” no aviso ou no topo da tela. Removidos podem ser restaurados no histórico.</span></details><details><summary>Arquitetura</summary><span class="mu">Esta demo é HTML/CSS/JS puro. O “domínio” (interpreta, resumo, csv) está separado da UI para migrar depois para React + TypeScript + Vite com adaptadores Google. Dados ficam só na memória.</span></details></div>`};
function interp(){const p=pend;if(p.erro)return`<div class="c warn" style="margin:12px 0 0">${p.erro}</div>`;const inc=!p.cat;return`<div class="c ${inc?'warn':''}" style="margin:12px 0 0"><b>Entendi:</b> ${p.tipo==='in'?'Entrada':'Saída'} de <b>${BRL(p.valor)}</b> · “${esc(p.desc)}” · ${dt(p.data)}${inc?'<div class="mu" style="margin:6px 0">Não tenho certeza da categoria. Escolha:</div>':''}<div class="row" style="margin-top:8px">${catSel(p.cat||'Outros','pc')}<select id="pt"><option value="out" ${p.tipo=='out'?'selected':''}>Saída</option><option value="in" ${p.tipo=='in'?'selected':''}>Entrada</option></select><button class="b" onclick="okPend()">Confirmar</button><button class="b o" onclick="pend=null;render()">Cancelar</button></div></div>`}
function hl(){const q=flt.q.toLowerCase(),L=S.tx.filter(t=>(flt.d||!t.del)&&(!flt.t||t.tipo===flt.t)&&(!flt.c||t.cat===flt.c)&&(!q||t.desc.toLowerCase().includes(q))).sort((a,b)=>b.data<a.data?-1:b.data>a.data?1:b.id-a.id);$('hl').innerHTML=L.map(t=>row(t,1)).join('')||'<div class="mu" style="padding:12px 0">Nenhum lançamento encontrado.</div>'}
const NAV=[['painel','Painel'],['historico','Histórico'],['categorias','Orçamentos'],['recorrencias','Previsões'],['relatorios','Relatórios'],['ajustes','Ajustes']];
function render(){const ap=V!=='land';let h=ap?`<nav>${NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><div class="row" style="justify-content:flex-end"><button class="b o sm" onclick="desfazer()" ${pilha.length?'':'disabled'}>Desfazer</button></div>`:`<nav><button class="on">Caixa Rápido</button><button onclick="go('painel')">Entrar</button></nav>`;
 h+=VIEWS[V]()+foot();if(ed)h+=`<div class="ov"><div class="c"><h2>Editar lançamento</h2><div class="row"><input id="ed" value="${esc(ed.desc)}"><input id="ev" type="number" step="0.01" value="${ed.valor}" style="width:110px">${catSel(ed.cat,'ec')}</div><div class="row" style="margin-top:12px"><button class="b" onclick="salvaEd()">Salvar</button><button class="b o" onclick="ed=null;render()">Cancelar</button></div></div></div>`;
 if(tg)h+=`<div class="tg">${tg.msg}${tg.msg.includes('desfeita')?'':'<button class="b o sm" onclick="desfazer()">Desfazer</button>'}</div>`;
 const f=document.activeElement&&document.activeElement.id,sv=f&&document.activeElement.value;$('app').innerHTML=`<div class="w">${h}</div>`;if(V==='historico')hl();if(f&&$(f)&&sv!==undefined&&!['q'].includes(f)){}}
function go(v){V=v;pend=null;csvTxt=null;scrollTo(0,0);render()}
function cap(){const s=$('q').value.trim();if(!s)return;const r=interpreta(s);r.src=s;pend=r;render();const q=$('q');if(q)q.focus()}
function okPend(){const p=pend;act(()=>{S.tx.push({id:++nid,tipo:$('pt').value,desc:p.desc,valor:p.valor,cat:$('pc').value,data:p.data});pend=null},'Lançamento registrado')}
function form(){const v=parseFloat($('fv').value),d=$('fd').value.trim();if(!(v>0)||!d){tg={msg:'Informe descrição e valor maior que zero'};render();return}act(()=>S.tx.push({id:++nid,tipo:$('ft').value,desc:d,valor:v,cat:$('fc').value,data:$('fa').value||hoje()}),'Lançamento adicionado')}
const rem=id=>act(()=>S.tx.find(t=>t.id==id).del=true,'Lançamento removido'),rest=id=>act(()=>delete S.tx.find(t=>t.id==id).del,'Lançamento restaurado');
function abrirEd(id){ed={...S.tx.find(t=>t.id==id)};render()}
function salvaEd(){const v=parseFloat($('ev').value);if(!(v>0))return;const id=ed.id;act(()=>{const t=S.tx.find(t=>t.id==id);t.desc=$('ed').value||t.desc;t.valor=v;t.cat=$('ec').value;ed=null},'Lançamento atualizado')}
function setOrc(){const v=parseFloat($('ov').value);if(!(v>=0))return;act(()=>S.orc[$('oc').value]=v,'Orçamento salvo')}
function addRec(){const v=parseFloat($('rv').value),d=$('rd').value.trim(),dia=parseInt($('rdia').value);if(!(v>0)||!d||!(dia>=1&&dia<=30))return;act(()=>S.rec.push({id:++nid,desc:d,valor:v,dia,cat:$('rc').value,tipo:$('rt').value}),'Recorrência cadastrada')}
function conf(id){act(()=>{const r=S.rec.find(r=>r.id==id);r.ok=true;S.tx.push({id:++nid,tipo:r.tipo,desc:r.desc,valor:r.valor,cat:r.cat,data:hoje()})},'Confirmado e lançado no realizado')}
function copiar(){const t=$('ct');t.select();try{document.execCommand('copy');tg={msg:'CSV copiado'}}catch(e){tg={msg:'Selecione e copie manualmente'}}const v=t.value;render();$('ct').value=v}
render();
</script></body></html>
